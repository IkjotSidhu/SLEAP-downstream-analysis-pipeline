<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <!-- Trajectory path gradient -->
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f78166" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="pathGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="10"/>

  <!-- Subtle grid -->
  <g stroke="#21262d" stroke-width="1">
    <line x1="0" y1="50"  x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Animal 1 trajectory (blue) -->
  <path d="M 30 140 C 80 130, 130 80, 200 90 S 300 130, 370 100 S 460 60, 530 80 S 620 120, 700 90 S 790 55, 870 70"
        fill="none" stroke="url(#pathGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Animal 2 trajectory (green) -->
  <path d="M 30 70 C 90 80, 140 120, 210 110 S 310 70, 390 95 S 480 130, 550 115 S 640 80, 720 105 S 810 140, 870 130"
        fill="none" stroke="url(#pathGrad2)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Keypoint dots — Animal 1 -->
  <circle cx="200" cy="90"  r="4" fill="#58a6ff" opacity="0.9"/>
  <circle cx="370" cy="100" r="4" fill="#58a6ff" opacity="0.9"/>
  <circle cx="530" cy="80"  r="4" fill="#58a6ff" opacity="0.9"/>
  <circle cx="700" cy="90"  r="4" fill="#58a6ff" opacity="0.9"/>

  <!-- Keypoint dots — Animal 2 -->
  <circle cx="210" cy="110" r="4" fill="#3fb950" opacity="0.9"/>
  <circle cx="390" cy="95"  r="4" fill="#3fb950" opacity="0.9"/>
  <circle cx="550" cy="115" r="4" fill="#3fb950" opacity="0.9"/>
  <circle cx="720" cy="105" r="4" fill="#3fb950" opacity="0.9"/>

  <!-- Distance line between two mid-points -->
  <line x1="370" y1="100" x2="390" y2="95" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <line x1="530" y1="80"  x2="550" y2="115" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>

  <!-- Title text -->
  <text x="450" y="172" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#8b949e" text-anchor="middle" letter-spacing="2">SLEAP ANALYSIS PIPELINE</text>

  <!-- Subtle node labels -->
  <text x="200" y="82"  font-family="monospace" font-size="8" fill="#58a6ff" opacity="0.7" text-anchor="middle">nose</text>
  <text x="370" y="92"  font-family="monospace" font-size="8" fill="#58a6ff" opacity="0.7" text-anchor="middle">body</text>
  <text x="530" y="72"  font-family="monospace" font-size="8" fill="#58a6ff" opacity="0.7" text-anchor="middle">tail</text>
  <text x="210" y="124" font-family="monospace" font-size="8" fill="#3fb950" opacity="0.7" text-anchor="middle">nose</text>
  <text x="390" y="110" font-family="monospace" font-size="8" fill="#3fb950" opacity="0.7" text-anchor="middle">body</text>
  <text x="550" y="130" font-family="monospace" font-size="8" fill="#3fb950" opacity="0.7" text-anchor="middle">tail</text>
</svg>
