<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#10151c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="10"/>

  <!-- Subtle grid -->
  <g stroke="#1c2128" stroke-width="0.8" opacity="0.5">
    <line x1="0" y1="40"  x2="900" y2="40"/>
    <line x1="0" y1="80"  x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="112" y1="0" x2="112" y2="200"/>
    <line x1="225" y1="0" x2="225" y2="200"/>
    <line x1="337" y1="0" x2="337" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="562" y1="0" x2="562" y2="200"/>
    <line x1="675" y1="0" x2="675" y2="200"/>
    <line x1="787" y1="0" x2="787" y2="200"/>
  </g>

  <!-- ====== MOUSE 1 (blue, facing right, top-down view) ====== -->
  <!-- Tail -->
  <path d="M 127,92 C 88,84 55,78 22,68"
        fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <!-- Body -->
  <ellipse cx="182" cy="92" rx="55" ry="27" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <!-- Head -->
  <ellipse cx="258" cy="92" rx="23" ry="17" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <!-- Ears (top-down: one each side of head) -->
  <circle cx="251" cy="77"  r="13" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <circle cx="251" cy="107" r="13" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <!-- Whiskers -->
  <g stroke="#58a6ff" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
    <line x1="273" y1="87" x2="257" y2="81"/>
    <line x1="273" y1="91" x2="255" y2="91"/>
    <line x1="273" y1="97" x2="257" y2="103"/>
  </g>
  <!-- Keypoint dots -->
  <circle cx="281" cy="92" r="4"   fill="#58a6ff"/>
  <circle cx="237" cy="92" r="3.5" fill="#58a6ff"/>
  <circle cx="182" cy="92" r="3.5" fill="#58a6ff"/>
  <circle cx="127" cy="92" r="3.5" fill="#58a6ff"/>
  <!-- Leader lines -->
  <g stroke="#58a6ff" stroke-width="0.8" opacity="0.35">
    <line x1="281" y1="88" x2="281" y2="73"/>
    <line x1="237" y1="88" x2="237" y2="63"/>
    <line x1="182" y1="88" x2="182" y2="53"/>
    <line x1="127" y1="88" x2="104" y2="74"/>
  </g>
  <!-- Labels above mouse 1 -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#58a6ff" text-anchor="middle">
    <text x="281" y="71">nose</text>
    <text x="237" y="61">neck</text>
    <text x="182" y="51">bodycenter</text>
    <text x="96"  y="72">tail_base</text>
  </g>

  <!-- ====== MOUSE 2 (green, facing left, top-down view) ====== -->
  <!-- Tail -->
  <path d="M 773,108 C 812,100 845,94 878,84"
        fill="none" stroke="#3fb950" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <!-- Body -->
  <ellipse cx="718" cy="108" rx="55" ry="27" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/>
  <!-- Head -->
  <ellipse cx="642" cy="108" rx="23" ry="17" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/>
  <!-- Ears -->
  <circle cx="649" cy="93"  r="13" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/>
  <circle cx="649" cy="123" r="13" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/>
  <!-- Whiskers -->
  <g stroke="#3fb950" stroke-width="0.9" stroke-linecap="round" opacity="0.55">
    <line x1="627" y1="103" x2="643" y2="97"/>
    <line x1="627" y1="107" x2="645" y2="107"/>
    <line x1="627" y1="113" x2="643" y2="119"/>
  </g>
  <!-- Keypoint dots -->
  <circle cx="619" cy="108" r="4"   fill="#3fb950"/>
  <circle cx="663" cy="108" r="3.5" fill="#3fb950"/>
  <circle cx="718" cy="108" r="3.5" fill="#3fb950"/>
  <circle cx="773" cy="108" r="3.5" fill="#3fb950"/>
  <!-- Leader lines -->
  <g stroke="#3fb950" stroke-width="0.8" opacity="0.35">
    <line x1="619" y1="112" x2="619" y2="127"/>
    <line x1="663" y1="112" x2="663" y2="137"/>
    <line x1="718" y1="112" x2="718" y2="147"/>
    <line x1="773" y1="112" x2="796" y2="126"/>
  </g>
  <!-- Labels below mouse 2 -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#3fb950" text-anchor="middle">
    <text x="619" y="139">nose</text>
    <text x="663" y="149">neck</text>
    <text x="718" y="159">bodycenter</text>
    <text x="804" y="138">tail_base</text>
  </g>

  <!-- Title -->
  <text x="450" y="186"
        font-family="ui-monospace, SFMono-Regular, monospace"
        font-size="12" fill="#484f58" text-anchor="middle" letter-spacing="3">SLEAP ANALYSIS PIPELINE</text>
</svg>
